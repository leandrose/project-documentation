openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
  description: Example CRUD API for users.
servers:
  - url: https://api.example.com
    description: Example server
paths:
  /users:
    get:
      tags:
        - Users
      summary: List users
      responses:
        '200':
          description: Users found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users
      summary: Get user by ID
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      tags:
        - Users
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    delete:
      tags:
        - Users
      summary: Delete user
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User identifier
  schemas:
    User:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - type: object
          required:
            - id
            - createdAt
          properties:
            id:
              type: string
              format: uuid
              example: 9f8f9a74-3b82-4e5a-9fd2-0d08c8e1a001
            createdAt:
              type: string
              format: date-time
              example: '2026-05-11T12:00:00Z'
    UserInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        active:
          type: boolean
          default: true
