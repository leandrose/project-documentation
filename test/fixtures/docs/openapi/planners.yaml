openapi: 3.0.3
info:
  title: Planners API
  version: 1.0.0
  description: Example CRUD API for planners.
servers:
  - url: https://api.example.com
    description: Example server
paths:
  /planners:
    get:
      tags:
        - Planners
      summary: List planners
      responses:
        '200':
          description: Planners found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Planner'
    post:
      tags:
        - Planners
      summary: Create planner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerInput'
      responses:
        '201':
          description: Planner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planner'
  /planners/{id}:
    parameters:
      - $ref: '#/components/parameters/PlannerId'
    get:
      tags:
        - Planners
      summary: Get planner by ID
      responses:
        '200':
          description: Planner found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planner'
        '404':
          description: Planner not found
    put:
      tags:
        - Planners
      summary: Update planner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerInput'
      responses:
        '200':
          description: Planner updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planner'
        '404':
          description: Planner not found
    delete:
      tags:
        - Planners
      summary: Delete planner
      responses:
        '204':
          description: Planner deleted
        '404':
          description: Planner not found
components:
  parameters:
    PlannerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Planner identifier
  schemas:
    Planner:
      allOf:
        - $ref: '#/components/schemas/PlannerInput'
        - type: object
          required:
            - id
            - createdAt
          properties:
            id:
              type: string
              format: uuid
              example: ddf1a260-1fc5-4f31-a2ce-f1f6d1ae0001
            createdAt:
              type: string
              format: date-time
              example: '2026-05-11T12:00:00Z'
    PlannerInput:
      type: object
      required:
        - title
        - calendarId
      properties:
        title:
          type: string
          example: Sprint planning
        calendarId:
          type: string
          format: uuid
          example: 4c0ee90a-75d7-4a19-a4ef-f4bdde9f0001
        dueDate:
          type: string
          format: date
          example: '2026-05-30'
        status:
          type: string
          enum:
            - draft
            - active
            - completed
          example: active
