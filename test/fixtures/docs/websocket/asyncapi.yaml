asyncapi: 3.0.0
info:
  title: Fixture WebSocket API
  version: 1.0.0
channels:
  userSignedUp:
    address: user/signed-up
    messages:
      userSignedUp:
        $ref: '#/components/messages/UserSignedUp'
operations:
  receiveUserSignedUp:
    action: receive
    channel:
      $ref: '#/channels/userSignedUp'
    messages:
      - $ref: '#/channels/userSignedUp/messages/userSignedUp'
components:
  messages:
    UserSignedUp:
      payload:
        type: object
        properties:
          id:
            type: string
